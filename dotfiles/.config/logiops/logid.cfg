# Source: dotfiles/.config/logiops/logid.cfg
# Edit this file in dotfiles, then run install/logiops.sh to update /etc/logid.cfg.

devices: (
{
    name: "Wireless Mouse MX Master 3";

    smartshift:
    {
        on: true;
        threshold: 30;
    };

    hiresscroll:
    {
        hires: true;
        invert: false;
        target: false;
    };

    thumbwheel:
    {
        divert: true;
        invert: false;

        left:
        {
            mode: "OnInterval";
            interval: 2;
            action:
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEDOWN"];
            };
        };

        right:
        {
            mode: "OnInterval";
            interval: 2;
            action:
            {
                type: "Keypress";
                keys: ["KEY_VOLUMEUP"];
            };
        };

        tap:
        {
            type: "Keypress";
            keys: ["KEY_MUTE"];
        };
    };

    dpi: 1000;

    buttons: (
        {
            cid: 0xc3;
            action:
            {
                type: "Gestures";
                gestures: (
                    {
                        direction: "Up";
                        mode: "OnRelease";
                        action:
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTCTRL", "KEY_F10"];
                        };
                    },
                    {
                        direction: "Down";
                        mode: "OnRelease";
                        action:
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTCTRL", "KEY_F7"];
                        };
                    },
                    {
                        direction: "Left";
                        mode: "OnRelease";
                        action:
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_LEFT"];
                        };
                    },
                    {
                        direction: "Right";
                        mode: "OnRelease";
                        action:
                        {
                            type: "Keypress";
                            keys: ["KEY_LEFTMETA", "KEY_RIGHT"];
                        };
                    },
                    {
                        direction: "None";
                        mode: "NoPress";
                    }
                );
            };
        },
        {
            cid: 0xc4;
            action:
            {
                type: "ToggleSmartshift";
            };
        },
        {
            cid: 0x53;
            action:
            {
                type: "Keypress";
                keys: ["KEY_PREVIOUSSONG"];
            };
        },
        {
            cid: 0x56;
            action:
            {
                type: "Keypress";
                keys: ["KEY_NEXTSONG"];
            };
        }
    );
}
);
